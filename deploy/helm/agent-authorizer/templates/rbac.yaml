{{- if .Values.rbac.subjectAccessReview.create -}}
{{- include "agent-authorizer.validate" . -}}
# The one permission agent-authorizer needs to answer questions about this cluster:
# create SubjectAccessReviews. They are never persisted; creating one only asks
# the API server "may this subject do that?".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent-authorizer.clusterScopedName" . }}
  labels:
    {{- include "agent-authorizer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-authorizer.clusterScopedName" . }}
  labels:
    {{- include "agent-authorizer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-authorizer.clusterScopedName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-authorizer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
