[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-authorizer"
dynamic = ["version"]
description = "Authorizes what an AI agent does against the permissions of the user it acts for: each request a tool makes is checked live with the system that owns the resource (GitHub, Jira, Kubernetes, AWS and more), plus scope limits, prompt-injection and exfiltration guards, credential injection and audit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.1"]
keywords = ["ai-agents", "security", "prompt-injection", "authorization", "permissions", "llm", "tools", "mcp", "langchain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
# RSA and ECDSA signing for the integrations that authenticate with a key:
# GitHub App, Google service accounts, Snowflake key pair, Salesforce JWT,
# Microsoft 365 certificates.
crypto = ["cryptography>=42"]
# Agent framework adapters: agent_authorizer.strands, agent_authorizer.langchain, agent_authorizer.openai_agents, ...
strands = ["strands-agents>=1.57.1"]
langchain = ["langchain>=1.4", "langgraph>=1.2"]
openai-agents = ["openai-agents>=0.22"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.160"]
google-adk = ["google-adk>=2.10"]
pydantic-ai = ["pydantic-ai-slim>=2.51"]
crewai = ["crewai>=1.15"]
llamaindex = ["llama-index-core>=0.14"]
# Export each tool run as a span: agent_authorizer.otel.
otel = ["opentelemetry-api>=1.20"]

[project.scripts]
agent-authorizer = "agent_authorizer.cli:main"

[project.urls]
Homepage = "https://github.com/roee-hersh/toolpass"
Documentation = "https://github.com/roee-hersh/toolpass/tree/main/docs"
Issues = "https://github.com/roee-hersh/toolpass/issues"
Source = "https://github.com/roee-hersh/toolpass/tree/main/agent-authorizer-py"

[tool.hatch.version]
path = "src/agent_authorizer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_authorizer"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_authorizer", "tests", "examples", "README.md", "LICENSE"]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["pytest-timeout>=2.3", "hypothesis>=6.100", "cryptography>=42"]

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.11", "types-PyYAML"]

[tool.hatch.envs.types.scripts]
check = "mypy --strict src/agent_authorizer"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
markers = [
  "live: calls real third-party systems (needs credentials)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# The framework adapters import their framework, an optional extra.
module = ["strands.*", "langchain.*", "langchain_core.*", "langgraph.*", "mcp.*", "agents.*", "claude_agent_sdk.*", "google.adk.*", "google.genai.*", "pydantic_ai.*", "crewai.*", "llama_index.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without the framework installed its base classes are Any; the adapters
# subclass them on purpose.
module = ["agent_authorizer.strands", "agent_authorizer.langchain", "agent_authorizer.openai_agents", "agent_authorizer.claude_agent_sdk", "agent_authorizer.google_adk", "agent_authorizer.pydantic_ai", "agent_authorizer.crewai", "agent_authorizer.llamaindex"]
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["agent_authorizer._api"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "A", "N", "SIM", "RUF"]
ignore = ["A001", "A002", "N801", "N814", "RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "SIM108", "N818", "UP007", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE", "B011", "N802", "SIM"]
# Fail closed: any failure in a check's hook (authorizer, approver, credentials) refuses the call.
"src/agent_authorizer/_toolkit.py" = ["BLE001"]
"src/agent_authorizer/_checks.py" = ["BLE001"]
"src/agent_authorizer/_approval.py" = ["BLE001"]
"src/agent_authorizer/_walk.py" = ["BLE001"]
# These tests exercise typing.Optional on purpose.
"tests/toolkit/**" = ["BLE", "B011", "N802", "SIM", "UP045"]
